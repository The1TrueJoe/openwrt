name: GL-SFT1200 debug modules

# Test builds for the GL.iNet GL-SFT1200 (siflower/sf19a2890) series.
# Not part of the series sent upstream.

on:
  push:
    branches:
      - siflower-gl-sft1200-debug
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build glinet_gl-sft1200
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget quilt zstd device-tree-compiler

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a2890=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_siflower_sf19a2890_DEVICE_glinet_gl-sft1200=y
          CONFIG_TARGET_DEVICE_siflower_sf19a2890_DEVICE_siflower_sf19a2890-evb=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          # Test convenience only, so images can be copied from a USB stick
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          EOF
          make defconfig
          grep -E 'DEVICE_glinet|ROOTFS_(INITRAMFS|SQUASHFS)|kmod-dsa' .config

      - name: Download sources
        run: make -j$(nproc) download || make -j1 download V=s

      - name: Build tools and toolchain
        id: toolchain
        run: make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

      - name: Debug-patch the mxl-gsw1xx RST_REQ write
        run: |
          make target/linux/prepare V=s > prepare.log 2>&1 || { tail -50 prepare.log; exit 1; }
          for src in build_dir/target-*/linux-siflower_sf19a2890/linux-6.18*/drivers/net/dsa/lantiq/mxl-gsw1xx.c; do
            python3 -I .github/gl-sft1200/debug/gsw1xx-dump-id.py "$src"
            grep -c DEBUG "$src"
          done

      - name: Build images
        id: build
        run: make -j$(nproc) || make -j1 V=s

      - name: Report image and kernel sizes
        if: always()
        run: |
          ls -l bin/targets/siflower/sf19a2890/ || true
          find build_dir/target-*/linux-siflower_sf19a2890 -maxdepth 1 \
            -name '*gl-sft1200*kernel*' -printf '%s bytes\t%f\n' || true
          echo "limit for the flash kernel: $((3 * 1024 * 1024)) bytes"
          grep -h 'is too big' logs/target/linux/*/*.txt 2>/dev/null || true

      - name: Verify images, partitions and failsafe behaviour
        if: always() && steps.build.outcome == 'success'
        run: |
          dtb=$(ls build_dir/target-*/linux-siflower_sf19a2890/image-sf19a2890_glinet_gl-sft1200.dtb)
          python3 -I .github/gl-sft1200/verify.py bin/targets/siflower/sf19a2890 "$dtb" | tee verify.txt

      - name: Sysupgrade negative tests
        if: always() && steps.build.outcome == 'success'
        run: bash .github/gl-sft1200/test-sysupgrade.sh . bin/targets/siflower/sf19a2890 | tee -a verify.txt

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glinet_gl-sft1200-debug-images
          path: |
            bin/targets/siflower/sf19a2890/
            verify.txt
            dt-validate.txt
          if-no-files-found: warn

      - name: Collect the debug modules
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir debug-modules
          # The debug-patched tree; the build may also leave other linux-6.18* trees
          f=$(grep -l rst_override build_dir/target-*/linux-siflower_sf19a2890/linux-6.18*/drivers/net/dsa/lantiq/mxl-gsw1xx.c | head -1)
          k=${f%/drivers/net/dsa/lantiq/mxl-gsw1xx.c}
          echo "kernel tree: $k"
          cp "$k"/drivers/net/dsa/lantiq/*.ko "$k"/net/dsa/tag_mxl-gsw1xx.ko debug-modules/
          for f in debug-modules/*.ko; do
            echo "$f: $(strings "$f" | grep -m1 '^vermagic=')"
          done | tee debug-modules/VERMAGIC
          strings debug-modules/mxl-gsw1xx.ko | grep -c rst_override
          cp bin/targets/siflower/sf19a2890/*glinet_gl-sft1200-squashfs-sysupgrade.bin debug-modules/DEBUG-sysupgrade.bin
          cp bin/targets/siflower/sf19a2890/*glinet_gl-sft1200-initramfs-kernel.bin debug-modules/DEBUG-initramfs-kernel.bin
          (cd debug-modules && sha256sum * | tee SHA256SUMS)

      - name: Upload the debug modules
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: glinet_gl-sft1200-DEBUG-rstreq
          path: debug-modules/

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
