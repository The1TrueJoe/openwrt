name: GL-SFT1200 images

# Test builds for the GL.iNet GL-SFT1200 (siflower/sf19a2890) series.
# Not part of the series sent upstream.

on:
  push:
    branches:
      - siflower-gl-sft1200-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build glinet_gl-sft1200
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget quilt zstd device-tree-compiler squashfs-tools

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a2890=y
          CONFIG_TARGET_MULTI_PROFILE=y
          # As the buildbots do, so each image gets its own DEVICE_PACKAGES
          # (the GL image leaves out uboot-envtools, the EVB keeps it)
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_TARGET_DEVICE_siflower_sf19a2890_DEVICE_glinet_gl-sft1200=y
          CONFIG_TARGET_DEVICE_siflower_sf19a2890_DEVICE_siflower_sf19a2890-evb=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          # Test convenience only, so images can be copied from a USB stick
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          EOF
          make defconfig
          grep -E 'DEVICE_glinet|ROOTFS_(INITRAMFS|SQUASHFS)|kmod-dsa' .config

      - name: Download sources
        run: make -j$(nproc) download || make -j1 download V=s

      - name: Build tools and toolchain
        id: toolchain
        run: make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

      - name: Build images
        id: build
        run: make -j$(nproc) || make -j1 V=s

      - name: Report image and kernel sizes
        if: always()
        run: |
          ls -l bin/targets/siflower/sf19a2890/ || true
          find build_dir/target-*/linux-siflower_sf19a2890 -maxdepth 1 \
            -name '*gl-sft1200*kernel*' -printf '%s bytes\t%f\n' || true
          echo "limit for the flash kernel: $((3 * 1024 * 1024)) bytes"
          grep -h 'is too big' logs/target/linux/*/*.txt 2>/dev/null || true

      - name: Verify images, partitions and failsafe behaviour
        if: always() && steps.build.outcome == 'success'
        run: |
          dtb=$(ls build_dir/target-*/linux-siflower_sf19a2890/image-sf19a2890_glinet_gl-sft1200.dtb)
          python3 -I .github/gl-sft1200/verify.py bin/targets/siflower/sf19a2890 "$dtb" | tee verify.txt

      - name: Sysupgrade negative tests
        if: always() && steps.build.outcome == 'success'
        run: bash .github/gl-sft1200/test-sysupgrade.sh . bin/targets/siflower/sf19a2890 | tee -a verify.txt

      - name: Check the GL image's package set
        if: always() && steps.build.outcome == 'success'
        run: |
          t=$(mktemp -d)
          tar -xf bin/targets/siflower/sf19a2890/*-glinet_gl-sft1200-squashfs-sysupgrade.bin -C "$t"
          unsquashfs -l -d r "$t"/sysupgrade-glinet_gl-sft1200/root > rootfs.txt
          grep -q '^r/lib/modules/.*/mxl-gsw1xx\.ko$' rootfs.txt
          if grep -E '/fw_(printenv|setenv)$|/rtl8367b\.ko$|^r/sbin/swconfig$' rootfs.txt; then
            echo "::error::the GL image carries packages it should not"
            exit 1
          fi
          echo "GL rootfs: mxl-gsw1xx present; no uboot-envtools, rtl8367b or swconfig" | tee -a verify.txt

      - name: Validate the DTB against Linux v7.3 bindings
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          pip install --user dtschema
          git clone --depth 1 --branch v7.3 --filter=blob:none --sparse \
            https://github.com/torvalds/linux.git linux-bindings
          git -C linux-bindings sparse-checkout set Documentation/devicetree/bindings
          # The binding half of the pending reset-gpios series
          patch -p1 -d linux-bindings < .github/gl-sft1200/linux/0001-dt-bindings-net-dsa-lantiq-gswip-add-reset-gpios.patch
          dt-mk-schema -j linux-bindings/Documentation/devicetree/bindings > processed-schema.json
          dtb=$(ls build_dir/target-*/linux-siflower_sf19a2890/image-sf19a2890_glinet_gl-sft1200.dtb)
          dt-validate -s processed-schema.json "$dtb" 2>&1 | tee dt-validate.txt

      - name: Check the DTB against the tree's own binding (make target/linux/dtbs_check)
        if: always() && steps.build.outcome == 'success'
        run: |
          # lantiq,gswip.yaml as patched by 723-46..52 and pending 761-01
          make target/linux/dtbs_check DT_SCHEMA_FILES=lantiq,gswip.yaml V=s 2>&1 | tee dtbs-check.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glinet_gl-sft1200-images
          path: |
            bin/targets/siflower/sf19a2890/
            verify.txt
            dt-validate.txt
            dtbs-check.txt
            rootfs.txt
          if-no-files-found: warn

      - name: Negative test, a kernel over the limit must not give images
        if: always() && steps.build.outcome == 'success'
        run: |
          kdir=$(ls -d build_dir/target-*/linux-siflower_sf19a2890)
          rm -f "$kdir"/glinet_gl-sft1200-* bin/targets/siflower/sf19a2890/*glinet_gl-sft1200*
          make target/linux/install KERNEL_SIZE=1024k V=s > small-kernel.log 2>&1 || true
          grep 'is too big' small-kernel.log
          if ls bin/targets/siflower/sf19a2890/*glinet_gl-sft1200*squashfs* 2>/dev/null; then
            echo "::error::images were produced with a kernel over KERNEL_SIZE"
            exit 1
          fi
          echo "no factory or sysupgrade image produced, as expected"

      - name: Check kernel patches are refreshed
        if: always()
        run: |
          make target/linux/refresh V=s
          git status --porcelain
          git diff > kernel-patch-refresh.diff
          [ ! -s kernel-patch-refresh.diff ] || echo "::warning::kernel patches need a refresh, see the artifact"

      - name: Upload refresh diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-patch-refresh
          path: kernel-patch-refresh.diff
          if-no-files-found: ignore

      - name: Kernel size experiments
        if: always() && steps.toolchain.outcome == 'success'
        timeout-minutes: 180
        run: bash .github/gl-sft1200/kernel-size.sh

      - name: Upload kernel size results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-size
          path: |
            kernel-size.txt
            build-*.log
          if-no-files-found: ignore

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
