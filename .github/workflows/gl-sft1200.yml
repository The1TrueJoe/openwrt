name: GL-SFT1200 diagnostic images

# Diagnostic builds for bring-up without a serial console: the kernel log
# goes out as netconsole UDP broadcasts. Never for upstream.

on:
  push:
    branches:
      - siflower-gl-sft1200-diag
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build glinet_gl-sft1200
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file \
            wget quilt zstd device-tree-compiler

      - name: Configure
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a2890=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_DEVICE_siflower_sf19a2890_DEVICE_glinet_gl-sft1200=y
          CONFIG_TARGET_DEVICE_siflower_sf19a2890_DEVICE_siflower_sf19a2890-evb=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_DEVEL=y
          CONFIG_BUILD_LOG=y
          CONFIG_PACKAGE_i2c-tools=y
          CONFIG_PACKAGE_kmod-i2c-designware-platform=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_kmod-nls-cp437=y
          CONFIG_PACKAGE_kmod-nls-iso8859-1=y
          CONFIG_PACKAGE_ubi-utils=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ip-bridge=y
          CONFIG_PACKAGE_ethtool=y
          EOF
          make defconfig
          grep -E 'DEVICE_glinet|ROOTFS_(INITRAMFS|SQUASHFS)|kmod-dsa|i2c|usb-storage|vfat|ubi-utils|ip-full|ip-bridge|ethtool' .config

      - name: Diagnostic rootfs overlay
        run: |
          cp -a .github/gl-sft1200/diag/files files
          mkdir -p files/etc/rc.d
          ln -s ../init.d/opal-diag files/etc/rc.d/S98opal-diag
          ln -s ../init.d/opal-diag-led files/etc/rc.d/S99opal-diag-led
          # Keep the DSA switch driver from autoloading: opal-diag loads it
          # later, once the untagged netconsole has sent the boot log.
          mkdir -p files/etc/modules.d
          : > files/etc/modules.d/42-dsa-mxl-gsw1xx
          find files -ls

      - name: Download sources
        run: make -j$(nproc) download || make -j1 download V=s

      - name: Build tools and toolchain
        id: toolchain
        run: make -j$(nproc) tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

      - name: Build images
        id: build
        run: make -j$(nproc) || make -j1 V=s

      - name: Report image and kernel sizes
        if: always()
        run: |
          ls -l bin/targets/siflower/sf19a2890/ || true
          find build_dir/target-*/linux-siflower_sf19a2890 -maxdepth 1 \
            -name '*gl-sft1200*kernel*' -printf '%s bytes\t%f\n' || true
          echo "limit for the flash kernel: $((3 * 1024 * 1024)) bytes"
          grep -h 'is too big' logs/target/linux/*/*.txt 2>/dev/null || true

      - name: Verify images, partitions and failsafe behaviour
        if: always() && steps.build.outcome == 'success'
        run: |
          dtb=$(ls build_dir/target-*/linux-siflower_sf19a2890/image-sf19a2890_glinet_gl-sft1200.dtb)
          python3 -I .github/gl-sft1200/verify.py bin/targets/siflower/sf19a2890 "$dtb" | tee verify.txt

      - name: Sysupgrade negative tests
        if: always() && steps.build.outcome == 'success'
        run: bash .github/gl-sft1200/test-sysupgrade.sh . bin/targets/siflower/sf19a2890 | tee -a verify.txt

      - name: Validate the DTB against Linux v7.3 bindings
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          pip install --user dtschema
          git clone --depth 1 --branch v7.3 --filter=blob:none --sparse \
            https://github.com/torvalds/linux.git linux-bindings
          git -C linux-bindings sparse-checkout set Documentation/devicetree/bindings
          dt-mk-schema -j linux-bindings/Documentation/devicetree/bindings > processed-schema.json
          dtb=$(ls build_dir/target-*/linux-siflower_sf19a2890/image-sf19a2890_glinet_gl-sft1200.dtb)
          dt-validate -s processed-schema.json "$dtb" 2>&1 | tee dt-validate.txt

      - name: Name the diagnostic images
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir diag
          cd bin/targets/siflower/sf19a2890
          for f in *glinet_gl-sft1200-squashfs-factory.img *glinet_gl-sft1200-squashfs-sysupgrade.bin *glinet_gl-sft1200-initramfs-kernel.bin; do
            [ -f "$f" ] && cp "$f" "../../../../diag/DIAG-$f"
          done
          cd ../../../../diag
          sha256sum * | tee SHA256SUMS

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glinet_gl-sft1200-DIAGNOSTIC-images
          path: |
            diag/
            verify.txt
            dt-validate.txt
          if-no-files-found: warn

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore
